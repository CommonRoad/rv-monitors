name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  cpp:
    name: C++ (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc-11, cxx: g++-11 }
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: gcc-14, cxx: g++-14 }
          - { cc: clang-16, cxx: clang++-16 }
          - { cc: clang-18, cxx: clang++-18 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ${{ matrix.cc }} \
            $([[ "${{ matrix.cxx }}" == g++-* ]] && echo "${{ matrix.cxx }}")
      - name: Configure
        run: cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm derives the version from tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest tests/python/bindings
