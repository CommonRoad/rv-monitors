stages:
  - static-test
  - compile
  - test
#  - sanitizer TODO
  - coverage
  - docs



image: $CI_REGISTRY/maierhofer/rv-monitors/ci:0.3.8

### static test ###
clang-format:
  stage: static-test
  script:
    bash ./ci/clang-format-test.sh

clang-tidy:
  stage: static-test
  script:
    bash ./ci/clang-tidy.sh


### build project ###
build-clang:
  stage: compile
  script:
    - export CC=clang
    - export CXX=clang++
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make rvmonitors -j4

build-gcc:
  stage: compile
  script:
    - export CC=gcc
    - export CXX=g++
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make rvmonitors -j4

build-test:
  stage: compile
  script:
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Debug ..
    - make rvmonitors_test -j4
  artifacts:
    paths:
      - ./build/
      - ./rvmonitors_test
      - ./librvmonitors.so
    expire_in: 20 minutes

build-run-coverage:
  stage: compile
  script:
    - mkdir build && cd build
    - cmake -DCODE_COVERAGE=ON -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_BUILD_TYPE=Debug ..
    - make rvmonitors_coverage -j4
  artifacts:
    paths:
      - ./build/
      - ./rvmonitors_coverage
      - ./librvmonitors.so
    expire_in: 20 minutes


### tests ###
test-coverage:
  stage: test
  script:
    - ./rvmonitors_test --gtest_output="xml:report.xml"
  dependencies:
    - build-test
  artifacts:
    reports:
      junit: ./report.xml


### coverage ###
publish-coverage:
  stage: coverage
  script:
    - gcovr -e 'cmake-(.+/)?/' -e tests/ -e build/ -e src/Parser/gen
  dependencies:
    - build-run-coverage


### docs ###
docs:
  stage: docs
  script:
    - cd build
    - cmake -DBUILD_DOXYGEN=ON ..
    - make doc_doxygen -DBUILD_DOXYGEN=ON ..