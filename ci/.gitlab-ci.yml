stages:
  - static-test
  - compile
  - test
#  - sanitizer TODO
  - coverage
#  - docs TODO



image: $CI_REGISTRY/maierhofer/rv-monitors/ci:0.1

### static test ###

clang-format:
  stage: static-test
  script:
    bash ./ci/clang-format-test.sh

#clang-tidy:
#  stage: static-test
#  script:
#    ./ci/clang-tidy.sh


build-library:
  stage: compile
  script:
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make rvmonitors -j4

#build-standalone:
#  stage: build
#  script:
#    - mkdir build && cd build
#    - cmake -DCMAKE_BUILD_TYPE=Release ..
#    - make env_model_example_node -j4

build-test:
  stage: compile
  script:
    - mkdir build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Debug ..
    - make rvmonitors_test -j4
  artifacts:
    paths:
      - ./rvmonitors_test
    expire_in: 20 minutes

build-run-coverage:
  stage: compile
  script:
    - mkdir build && cd build
    - cmake -DCODE_COVERAGE=ON -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_BUILD_TYPE=Debug ..
    - make rvmonitors_coverage -j4
  artifacts:
    paths:
      - ./build/
      - ./rvmonitors_coverage
    expire_in: 20 minutes


test-coverage:
  stage: test
  script:
    - ./rvmonitors_test --gtest_output="xml:report.xml"
  dependencies:
    - build-test
  artifacts:
    reports:
      junit: ./report.xml

publish-coverage:
  stage: coverage
  script:
    - gcovr -e 'cmake-(.+/)?/' -e tests/ -e build/ -e src/Parser/gen
  dependencies:
    - build-run-coverage
