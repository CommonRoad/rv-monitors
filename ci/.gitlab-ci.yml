stages:
  - compile
  - test
  - coverage
  - static-test
  - docs
  - evaluation



image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci-lite:1.1

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"

### static test ###
clang-format:
  image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci:1.4
  stage: static-test
  script: bash ./ci/clang-format.sh
  needs: []

clang-tidy:
  image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci:1.4
  stage: static-test
  script: bash ./ci/clang-tidy.sh
  needs:
    - job: build-compile-commands
      artifacts: true

cppcheck:
  stage: static-test
  script:
    cppcheck
    --project=build/compile_commands.json
    -i"$(pwd)/external"
  needs:
    - job: build-compile-commands
      artifacts: true

.cache-build-dir:
  cache: &cache_dependency_archives
    key: cache-dependency-archives
    paths:
      - build/_deps/*-subbuild/*-populate-prefix/src/*.{tar*,zip}
    policy: pull

generate-cache:
  stage: compile
  cache:
    <<: *cache_dependency_archives
    policy: push
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DFETCHCONTENT_QUIET:BOOL=OFF
  needs: []

### build project ###
build-compile-commands:
  stage: compile
  script:
    # run CMake in order to get compile_commands.json
    - mkdir build && cd build
    - cmake -DCMAKE_PREFIX_PATH=/commonroad/dist -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON  ..
    - cd ..
  needs: []
  artifacts:
    paths:
      - ./build/compile_commands.json
    expire_in: 20 minutes

build-clang:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  variables:
    CC: clang
    CXX: clang++
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-gcc:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  variables:
    CC: gcc
    CXX: g++
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-evaluation:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release --target rvmonitors_eval
  artifacts:
    paths:
      - build
  needs: []


build-test:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Debug --target rvmonitors_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-coverage:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DRVMonitors_BUILD_CODE_COVERAGE=ON
    - cmake --build build --config Debug --target rvmonitors_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-python:
  stage: compile
  image: python:3.12-bullseye
  script:
    - DEBIAN_FRONTEND=noninteractive apt-get update && apt-get -y install openjdk-11-jre-headless
    - python --version
    - git describe --always
    - python -m venv venv
    - echo "/venv" >> .gitignore
    - source venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install build~=1.2.1 pytest~=8.1.1
    - python -m build
    - python -m pip install dist/*.whl
    - python -m pytest tests/bindings
  needs: []
  variables:
    # Necessary so that Git detects all tags
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_FETCH_EXTRA_FLAGS: --tags
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.whl
    expire_in: 30 minutes

### create documentation ###
docs:
  stage: docs
  script:
    - mkdir -p build && cd build
    - cmake -DCMAKE_PREFIX_PATH=/commonroad/dist -DCMAKE_BUILD_TYPE=Debug -DRVMonitors_BUILD_DOXYGEN=ON  ..
    - make doc_doxygen ..
  dependencies: []
  artifacts:
    paths:
      - build/doc_doxygen/html/
    expose_as: 'Doxygen Documentation'
    expire_in: 20 minutes

### evaluate rvmonitors ###
evaluation_hydra_python:
  stage: evaluation
  image: python:3.10
  script:
    - chmod +x /builds/cps/commonroad/rv-monitors/evaluation/exec/gen_fmla
    - chmod +x /builds/cps/commonroad/rv-monitors/evaluation/exec/gen_log
    - pip install -r ./evaluation/requirements.txt
    - pip install pytest
    - pytest ./tests/test_org_hydra_eval.py
  needs:
    - job: build-evaluation
      artifacts: true
