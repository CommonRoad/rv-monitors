stages:
  - compile
  - test
  - coverage
  - static-test
  - docs
  - evaluation



image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci-lite:1.1

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"

### static test ###
clang-format:
  image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci:1.4
  stage: static-test
  script: bash ./ci/clang-format.sh
  needs: []

clang-tidy:
  image: $CI_REGISTRY/cps/rapid-prototyping-setup/ci:1.4
  stage: static-test
  script: bash ./ci/clang-tidy.sh
  needs:
    - job: build-compile-commands
      artifacts: true

cppcheck:
  stage: static-test
  script:
    cppcheck
    --project=build/compile_commands.json
    -i"$(pwd)/external"
  needs:
    - job: build-compile-commands
      artifacts: true

.cache-build-dir:
  cache: &cache_dependency_archives
    key: cache-dependency-archives
    paths:
      - build/_deps/*-subbuild/*-populate-prefix/src/*.{tar*,zip}
    policy: pull

generate-cache:
  stage: compile
  cache:
    <<: *cache_dependency_archives
    policy: push
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DFETCHCONTENT_QUIET:BOOL=OFF
  needs: []

### build project ###
build-compile-commands:
  stage: compile
  script:
    # run CMake in order to get compile_commands.json
    - mkdir build && cd build
    - cmake -DCMAKE_PREFIX_PATH=/commonroad/dist -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON  ..
    - cd ..
  needs: []
  artifacts:
    paths:
      - ./build/compile_commands.json
    expire_in: 20 minutes

build-clang:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  variables:
    CC: clang
    CXX: clang++
  script:
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_config "CMake Configuration"
    - cmake -G "Ninja Multi-Config" -S . -B build
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_config
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_build "CMake Build"
    - cmake --build build --config Release
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_build
  needs: []

build-gcc:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  variables:
    CC: gcc
    CXX: g++
  script:
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_config "CMake Configuration"
    - cmake -G "Ninja Multi-Config" -S . -B build
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_config
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_build "CMake Build"
    - cmake --build build --config Release
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_build
  needs: []

build-evaluation:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_config "CMake Configuration"
    - cmake -G "Ninja Multi-Config" -S . -B build
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_config
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_build "CMake Build"
    - cmake --build build --config Release --target rvmonitors_eval
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_build
  needs: []


build-test:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_config "CMake Configuration"
    - cmake -G "Ninja Multi-Config" -S . -B build
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_config
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_build "CMake Build"
    - cmake --build build --config Debug --target rvmonitors_test
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_build
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-coverage:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_config "CMake Configuration"
    - cmake -G "Ninja Multi-Config" -S . -B build -DRVMONITORS_BUILD_CODE_COVERAGE=ON
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_config
    - printf "\e[0Ksection_start:%s:%s\r\e[0K%s\n" "$(date +%s)"
      section_build "CMake Build"
    - cmake --build build --config Debug --target rvmonitors_test
    - printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)"
      section_build
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-nix:
  stage: compile
  image: nixos/nix:latest
  script:
    - nix --extra-experimental-features "nix-command flakes" --print-build-logs build

### create documentation ###
docs:
  stage: docs
  script:
    - mkdir -p build && cd build
    - cmake -DCMAKE_PREFIX_PATH=/commonroad/dist -DCMAKE_BUILD_TYPE=Debug -DRVMONITORS_BUILD_DOXYGEN=ON  ..
    - make doc_doxygen ..
  dependencies: []
  artifacts:
    paths:
      - build/doc_doxygen/html/
    expose_as: 'Doxygen Documentation'
    expire_in: 20 minutes

### evaluate rvmonitors ###
evaluation:
  stage: evaluation
  image: $CI_REGISTRY/maierhofer/rv-monitors/ci-hydra:0.5.0
  allow_failure: true
  when: manual
  script:
    - /commonroad/evaluate.sh "$(pwd)/build/rvmonitors_eval"
  after_script:
    - mkdir -p eval_results
    - cp -r --target-directory=eval_results
      /opt/hydra/evaluation/output
      /opt/hydra/evaluation/fmlas
      /opt/hydra/evaluation/logs
      /opt/hydra/evaluation/error.log
      /opt/hydra/evaluation/bug*.mdl 
  needs:
    - job: build-evaluation
      artifacts: true
  artifacts:
    name: evaluation_artifacts
    paths:
      - eval_results
