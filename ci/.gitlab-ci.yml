stages:
  - compile
  - test
  - coverage
  - static-test
  - docs
  - evaluation

image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-base:2025.2

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"

### static test ###
clang-format:
  image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-base:2025.2
  stage: static-test
  script: bash ./ci/clang-format.sh
  needs: []

clang-tidy:
  image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-base:2025.2
  stage: static-test
  script: bash ./ci/clang-tidy.sh
  needs:
    - job: build-compile-commands
      artifacts: true

cppcheck:
  stage: static-test
  script:
    cppcheck
    --project=build/compile_commands.json
    -i"$(pwd)/external"
  needs:
    - job: build-compile-commands
      artifacts: true

pre_commit:
  image: python:3.11
  stage: static-test
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure
  needs: []

.cache-build-dir:
  cache: &cache_dependency_archives
    key: cache-dependency-archives
    paths:
      - build/_deps/*-subbuild/*-populate-prefix/src/*.{tar*,zip}
    policy: pull

generate-cache:
  stage: compile
  cache:
    <<: *cache_dependency_archives
    policy: push
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DFETCHCONTENT_QUIET:BOOL=OFF
  needs: []

### build project ###
build-compile-commands:
  stage: compile
  script:
    # run CMake in order to get compile_commands.json
    - cmake -G Ninja -S . -B build
      -DCMAKE_PREFIX_PATH=/commonroad/dist
      -DCMAKE_BUILD_TYPE=Debug
      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build
  needs: []
  artifacts:
    paths:
      - ./build
    expire_in: 20 minutes

build-clang:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-clang:2025.2
  parallel:
    matrix:
      - CLANG_VERSION: [15, 16, 17, 18, 19]
  variables:
    CC: clang-$CLANG_VERSION
    CXX: clang++-$CLANG_VERSION
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-gcc:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-gcc:2025.2
  parallel:
    matrix:
      - GCC_VERSION: [10, 11, 12, 13, 14]
  variables:
    CC: x86_64-linux-gnu-gcc-$GCC_VERSION
    CXX: x86_64-linux-gnu-g++-$GCC_VERSION
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-ubuntu2204:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image: $CI_REGISTRY/tum-cps/commonroad-docker/ci-ubuntu2204:2025.2
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-evaluation:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release --target rvmonitors_eval
  artifacts:
    paths:
      - build
  needs: []


build-test:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Debug --target rvmonitors_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-coverage:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DRVMonitors_BUILD_CODE_COVERAGE=ON
    - cmake --build build --config Debug --target rvmonitors_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-python:
  stage: compile
  image: python:3.12-bullseye
  script:
    - DEBIAN_FRONTEND=noninteractive apt-get update && apt-get -y install openjdk-11-jre-headless
    - python --version
    - git describe --always
    - python -m venv venv
    - echo "/venv" >> .gitignore
    - source venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install build~=1.2.1 pytest~=8.1.1
    - python -m build
    - python -m pip install dist/*.whl
    - python -m pytest tests/bindings
  needs: []
  variables:
    # Necessary so that Git detects all tags
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_FETCH_EXTRA_FLAGS: --tags
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*.whl
    expire_in: 30 minutes

### tests ###
test:
  stage: test
  script:
    - cmake --build build --config RelWithDebInfo --target test
  needs:
    - job: build-test
      artifacts: true
  artifacts:
    # Upload reports even if tests fail
    when: always
    reports:
      junit: build/test-reports/*.xml
    expire_in: 30 minutes

run-coverage:
  stage: test
  script:
    - cmake --build build --config RelWithDebInfo --target rvmonitors_coverage
    - gcovr --version
    - gcovr
      -f src/
      -e build/
      --print-summary
      --exclude-unreachable-branches
      --output coverage.xml
      --xml
    - mv build/rvmonitors_coverage coverage-report
  needs:
    - job: build-coverage
      artifacts: true
  coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    paths:
      - coverage-report
    expose_as: 'Coverage Report'
    expire_in: 30 minutes
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

.install-python-venv: &install-python-venv
  - apt-get update && apt-get install -y --no-install-recommends git python3-venv python3-pip python3-dev doxygen openjdk-11-jre-headless
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de".insteadOf "ssh://git@gitlab.lrz.de"
  - python3 -m pip config set global.disable-pip-version-check true
  - python3 -m venv test-venv
  - source test-venv/bin/activate
  - python3 -m pip install pip-tools


pages:
  stage: docs
  when: manual
  publish: site
  script:
    - *install-python-venv
    - pip install ".[docs]"
    - mkdocs build
  artifacts:
    paths:
      - site
  environment:
    name: Gitlab Pages
    url: https://cps.pages.gitlab.lrz.de/commonroad/rv-monitors/
  needs: []

build_pages:
  stage: docs
  script:
    - *install-python-venv
    - pip install ".[docs]"
    - mkdocs build
  artifacts:
    paths:
      - site
  needs: []


### evaluate rvmonitors ###
evaluation_hydra_python:
  stage: evaluation
  image: python:3.10
  script:
    - chmod +x /builds/cps/commonroad/rv-monitors/evaluation/exec/gen_fmla
    - chmod +x /builds/cps/commonroad/rv-monitors/evaluation/exec/gen_log
    - pip install pytest psutil matplotlib pyyaml
    - pytest ./tests/test_org_hydra_eval.py
  needs:
    - job: build-evaluation
      artifacts: true
